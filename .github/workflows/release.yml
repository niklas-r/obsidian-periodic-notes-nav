name: Release

on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and draft a release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches the manifest
        run: npm run validate -- --tag "$GITHUB_REF_NAME"

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Obsidian installs a plugin from these three files, so they are attached
      # to the release individually rather than as an archive.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            build/main.js build/manifest.json build/styles.css
